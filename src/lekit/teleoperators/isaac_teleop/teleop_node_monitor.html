<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isaac Teleop Node</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090e14;
      --panel: #121a24;
      --panel-soft: #172231;
      --line: #263548;
      --text: #edf4fb;
      --muted: #8fa0b3;
      --ok: #46dda0;
      --warn: #f4c65b;
      --bad: #ff737c;
      --left: #5bc9f5;
      --right: #f5b84b;
      --inactive: #56616e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% -20%, #1c3046 0, var(--bg) 45%);
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
    }
    main { max-width: 1480px; margin: auto; padding: 18px; }
    header { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: stretch; gap: 10px; }
    h1 { align-self: center; margin: 0; font-size: 21px; letter-spacing: .01em; white-space: nowrap; }
    #badge { align-self: center; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-weight: 700; white-space: nowrap; }
    .metrics { display: grid; grid-template-columns: repeat(7, minmax(82px, 1fr)); gap: 7px; min-width: 0; }
    .metric, .pose-panel, .controller-panel {
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 14px 34px #0004;
    }
    .metric { padding: 8px 11px; min-height: 58px; }
    .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .09em; }
    .value { margin-top: 4px; font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    #error { position: absolute; z-index: 10; top: 74px; left: 18px; right: 18px; border: 1px solid #65353c; background: #2b181df2; color: #ffb8bd; border-radius: 12px; padding: 9px 12px; display: none; }

    .dashboard-workspace { display: grid; gap: 10px; min-height: 0; }
    .pose-panel { overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px 0; }
    .section-head h2 { margin: 0; font-size: 17px; }
    .pose-status { display: flex; align-items: center; gap: 13px; color: var(--muted); font-size: 11px; }
    .render-rate { padding-left: 12px; border-left: 1px solid var(--line); white-space: nowrap; }
    .render-rate strong { color: var(--text); font: 700 12px ui-monospace, monospace; }
    #pose-scene { position: relative; width: 100%; height: 100%; min-height: 280px; }
    #pose-scene canvas { display: block; width: 100%; height: 100%; }
    #three-fallback { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); }
    .controllers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
    .controller-panel { --hand: var(--inactive); display: grid; grid-template-rows: minmax(210px, .46fr) minmax(0, .54fr); min-height: 0; overflow: hidden; }
    .controller-panel.left { --active-hand: var(--left); }
    .controller-panel.right { --active-hand: var(--right); }
    .controller-panel[data-tracking="true"] { --hand: var(--active-hand); }
    .controller-figure { position: relative; display: grid; place-items: center; padding: 14px; background: radial-gradient(circle, color-mix(in srgb, var(--hand) 12%, transparent), transparent 64%); }
    .controller-figure svg { width: auto; max-width: 100%; height: min(100%, 250px); overflow: visible; }
    .controller-shell { fill: #222c37; stroke: var(--hand); stroke-width: 4; transition: stroke .18s, filter .18s, opacity .18s; }
    .controller-panel[data-tracking="true"] .controller-shell { filter: drop-shadow(0 0 9px color-mix(in srgb, var(--hand) 72%, transparent)); }
    .controller-panel[data-tracking="false"] .controller-shell { opacity: .58; }
    .control { color: #65717f; transition: color .12s, filter .12s, opacity .12s; }
    .control .control-surface { fill: currentColor; stroke: #9aa8b7; stroke-width: 1.5; }
    .control text { fill: #0a1016; font: 700 11px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
    .control.is-active { color: var(--hand); filter: drop-shadow(0 0 7px currentColor); }
    .analog { opacity: calc(.28 + var(--level, 0) * .72); }
    .stick-gate { fill: #2f3b48; stroke: #8290a0; stroke-width: 2; }
    .stick-knob { fill: var(--hand); stroke: #d9e3ed; stroke-width: 1.5; transition: transform .1s linear; }
    .stick-knob.is-active { filter: drop-shadow(0 0 7px var(--hand)); stroke: var(--hand); }
    .aim-beam { stroke: var(--hand); stroke-width: 4; stroke-linecap: round; opacity: .14; }
    .aim-beam.is-active { opacity: 1; filter: drop-shadow(0 0 6px var(--hand)); }
    .controller-state { position: absolute; left: 13px; right: 13px; bottom: 12px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .state-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; color: var(--muted); background: #0b1119cc; font-size: 11px; }
    .state-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--inactive); }
    .state-chip.is-active { color: var(--text); border-color: var(--hand); }
    .state-chip.is-active::before { background: var(--hand); box-shadow: 0 0 8px var(--hand); }
    .controller-details { border-top: 1px solid var(--line); padding: 11px 12px; min-height: 0; }
    .controller-details h2 { margin: 0 0 8px; color: var(--hand); font-size: 16px; transition: color .18s; }
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .input-tile { padding: 7px 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-soft); min-width: 0; }
    .input-tile .input-icon { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; color: var(--muted); }
    .input-tile .input-icon strong { color: var(--text); font-size: 15px; }
    .meter { height: 6px; margin-top: 5px; border-radius: 6px; background: #0a1017; overflow: hidden; }
    .meter > span { display: block; width: calc(var(--level, 0) * 100%); height: 100%; border-radius: inherit; background: var(--hand); transition: width .1s linear; }
    .button-cluster { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .button-dot { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); background: #252f3a; border: 1px solid #526070; font-size: 10px; font-weight: 700; }
    .button-dot.is-active { color: #081018; background: var(--hand); border-color: var(--hand); box-shadow: 0 0 9px var(--hand); }
    .exact-poses { margin-top: 7px; display: grid; gap: 4px; }
    .exact-row { display: grid; grid-template-columns: 88px 1fr; gap: 6px; border-top: 1px solid var(--line); padding-top: 4px; color: var(--muted); font: 10px/1.35 ui-monospace, monospace; }
    .exact-row span:last-child { color: var(--text); text-align: right; overflow-wrap: anywhere; }
    footer { color: var(--muted); text-align: right; font-size: 11px; }
    @media (min-width: 1800px) {
      html, body { height: 100%; overflow: hidden; }
      main { position: relative; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 9px; padding: 10px 14px; }
      .dashboard-workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.3fr) minmax(360px, .8fr); }
      .controllers { grid-template-columns: 1fr 1fr; }
      .controller-panel { grid-template-columns: minmax(260px, .34fr) minmax(0, .66fr); grid-template-rows: minmax(0, 1fr); }
      .controller-details { border-top: 0; border-left: 1px solid var(--line); overflow: hidden; }
      .controller-figure { padding: 10px; }
      .controller-figure svg { width: min(100%, 300px); height: auto; max-height: calc(100% - 46px); }
      .controller-state { left: 7px; right: 7px; gap: 4px; }
      .state-chip { gap: 4px; padding: 3px 6px; }
    }
    @media (max-width: 1799px) {
      .dashboard-workspace { grid-template-columns: 1fr; margin-top: 10px; }
      .controllers { grid-template-columns: 1fr 1fr; }
      .controller-panel { min-height: 560px; }
      #pose-scene { height: 360px; }
    }
    @media (max-width: 760px) {
      main { padding: 14px; }
      header { grid-template-columns: 1fr auto; }
      header .metrics { grid-column: 1 / -1; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .controllers { grid-template-columns: 1fr; }
      .controller-panel { min-height: 650px; }
      #pose-scene { height: 310px; }
      .pose-status { align-items: end; flex-direction: column-reverse; gap: 3px; }
      .render-rate { border-left: 0; padding-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation: none !important; } }
  </style>
</head>
<body><main>
  <header>
    <h1>Isaac Teleop Node</h1>
    <div id="badge" aria-live="polite">connecting</div>
    <section class="metrics" aria-label="Service metrics">
      <div class="metric"><div class="label">Publish rate</div><div class="value" id="rate">—</div></div>
      <div class="metric"><div class="label">XR frame age</div><div class="value" id="age">—</div></div>
      <div class="metric"><div class="label">Sequence</div><div class="value" id="sequence">—</div></div>
      <div class="metric"><div class="label">Sampled</div><div class="value" id="sampled">0</div></div>
      <div class="metric"><div class="label">Published</div><div class="value" id="published">0</div></div>
      <div class="metric"><div class="label">Dropped</div><div class="value" id="dropped">0</div></div>
      <div class="metric"><div class="label">Uptime</div><div class="value" id="uptime">00:00:00</div></div>
    </section>
  </header>

  <div id="error" role="alert"></div>

  <div class="dashboard-workspace">
  <section class="pose-panel">
    <div class="section-head">
      <div class="pose-status">
        <div class="render-rate">Render <strong id="render-rate">— Hz</strong></div>
      </div>
    </div>
    <div id="pose-scene" role="img" aria-label="3D relative controller poses">
      <div id="three-fallback">3D view unavailable; live controls remain active.</div>
    </div>
  </section>

  <section class="controllers" aria-label="Controller input status">
    <article class="controller-panel left" id="left-controller" data-tracking="false">
      <div class="controller-figure">
        <svg viewBox="0 0 240 330" role="img" aria-label="Left Quest 3 controller">
          <title>Left Quest 3 controller input state</title>
          <path class="aim-beam" data-indicator="aim" d="M116 48 L116 2" />
          <path class="controller-shell" d="M117 33 C75 33 54 54 58 88 C61 112 78 123 91 137 C103 150 94 172 87 195 C78 224 83 283 111 305 C126 317 146 308 151 288 C160 251 151 218 151 187 C151 161 166 145 177 123 C191 94 189 57 162 42 C150 35 134 33 117 33 Z" />
          <g class="control" data-control="trigger"><path class="control-surface analog" d="M68 104 C51 116 48 141 62 152 L80 134 C73 125 74 115 82 109 Z" /></g>
          <g class="control" data-control="squeeze"><path class="control-surface analog" d="M91 165 C81 194 79 226 84 246 L101 241 C97 218 100 192 109 171 Z" /></g>
          <g data-control="thumbstick"><circle class="stick-gate" cx="96" cy="83" r="20"/><circle class="stick-knob" data-part="stick-knob" cx="96" cy="83" r="10"/></g>
          <g class="control" data-control="primary_button"><circle class="control-surface" cx="143" cy="72" r="12"/><text x="143" y="72">X</text></g>
          <g class="control" data-control="secondary_button"><circle class="control-surface" cx="163" cy="96" r="12"/><text x="163" y="96">Y</text></g>
          <g class="control" data-control="menu_button"><circle class="control-surface" cx="128" cy="116" r="9"/><text x="128" y="116">≡</text></g>
        </svg>
        <div class="controller-state">
          <span class="state-chip" data-indicator="tracking">Tracking</span>
          <span class="state-chip" data-indicator="aim-tracking">Aim</span>
          <span class="state-chip" data-indicator="engaged">Engaged</span>
        </div>
      </div>
      <div class="controller-details"><div data-details-for="left"></div></div>
    </article>

    <article class="controller-panel right" id="right-controller" data-tracking="false">
      <div class="controller-figure">
        <svg viewBox="0 0 240 330" role="img" aria-label="Right Quest 3 controller">
          <title>Right Quest 3 controller input state</title>
          <path class="aim-beam" data-indicator="aim" d="M124 48 L124 2" />
          <path class="controller-shell" d="M123 33 C165 33 186 54 182 88 C179 112 162 123 149 137 C137 150 146 172 153 195 C162 224 157 283 129 305 C114 317 94 308 89 288 C80 251 89 218 89 187 C89 161 74 145 63 123 C49 94 51 57 78 42 C90 35 106 33 123 33 Z" />
          <g class="control" data-control="trigger"><path class="control-surface analog" d="M172 104 C189 116 192 141 178 152 L160 134 C167 125 166 115 158 109 Z" /></g>
          <g class="control" data-control="squeeze"><path class="control-surface analog" d="M149 165 C159 194 161 226 156 246 L139 241 C143 218 140 192 131 171 Z" /></g>
          <g data-control="thumbstick"><circle class="stick-gate" cx="144" cy="83" r="20"/><circle class="stick-knob" data-part="stick-knob" cx="144" cy="83" r="10"/></g>
          <g class="control" data-control="primary_button"><circle class="control-surface" cx="97" cy="72" r="12"/><text x="97" y="72">A</text></g>
          <g class="control" data-control="secondary_button"><circle class="control-surface" cx="77" cy="96" r="12"/><text x="77" y="96">B</text></g>
          <g class="control" data-control="menu_button"><circle class="control-surface" cx="112" cy="116" r="9"/><text x="112" y="116">≡</text></g>
        </svg>
        <div class="controller-state">
          <span class="state-chip" data-indicator="tracking">Tracking</span>
          <span class="state-chip" data-indicator="aim-tracking">Aim</span>
          <span class="state-chip" data-indicator="engaged">Engaged</span>
        </div>
      </div>
      <div class="controller-details"><div data-details-for="right"></div></div>
    </article>
  </section>
  </div>
  <footer id="updated">Waiting for /api/stream</footer>
</main>
<script type="module" src="/assets/teleop_node_monitor.js"></script>
</body></html>
