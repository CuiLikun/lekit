[project]
name = "lekit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cmake>=3.29.0,<4.0.0",
    "lerobot>=0.6.0",
    "pyzmq>=27.1.0",
    "textual>=8.2.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["tests/artifacts/**/*.safetensors"]
